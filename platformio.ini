; FOTA (Firmware-Over-The-Air) project for ESP32 (100 devices)
; PlatformIO + Arduino framework
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; default.csv already defines: nvs, otadata, ota_0, ota_1, spiffs
; -> this is what gives us the OTA_0 / OTA_1 ping-pong pair.
board_build.partitions = default.csv

lib_deps =
    cyijun/ESP32MQTTClient          ; true QoS2 MQTT client (matches existing project decision)
    bblanchon/ArduinoJson@^7         ; firmware metadata parsing

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
